# Claude/Codex-specific tmux integration

# ─── Window naming ───────────────────────────────────────────────────────────

# Auto-rename windows based on the foreground command.
# Claude Code's binary is a symlink to a version-named file (e.g. 2.1.86),
# so tmux sees the version as pane_current_command. Match semver → "claude".
# Similarly, codex-* → "codex".
set -wg automatic-rename on
set -wg automatic-rename-format "#{s/^[0-9]+\\.[0-9]+\\.[0-9]+$/claude/:#{s/^codex-.*/codex/:pane_current_command}}"
set -wg allow-rename off

# ─── Codex window ────────────────────────────────────────────────────────────

# Open codex in a new named window; auto-rename is disabled so it stays "codex".
bind -n M-q new-window -n "codex" \; set-window-option automatic-rename off \; send-keys "codex" Enter
