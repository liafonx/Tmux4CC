# Status bar right section — width-responsive keybind cheatsheet
# avail = client_width - 15 (left) - session_windows * 10 (tabs)
# ≥65: full cheatsheet | ≥45: nav+tools | ≥25: nav-only | <25: empty
# #{e|>=:} for numeric comparison (#{>=:} is lexicographic in tmux 3.4+).
set -g status-right "#{?#{==:#{pane_mode},tree-mode},#[fg=#a6adc8] Enter attach  x kill  / search  t tag  q quit,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},65},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢ #[bold]0#[nobold]-9  #[fg=#45475a]│#[fg=#a6adc8] #[bold]c#[nobold]new #[bold]m#[nobold]erge #[bold]z#[nobold]oom  #[fg=#45475a]│#[fg=#a6adc8] ^#[bold]󱁐#[nobold] thumbs  ^#[bold]?#[nobold]fuzzback  #[fg=#45475a]│#[fg=#a6adc8] ^#[bold]s#[nobold]ave ^#[bold]r#[nobold]estore,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},45},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢ #[bold]0#[nobold]-9  #[fg=#45475a]│#[fg=#a6adc8] #[bold]c#[nobold]new #[bold]m#[nobold]erge #[bold]z#[nobold]oom,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},25},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢,}}}}"
