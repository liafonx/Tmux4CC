# ─── Terminal correctness ────────────────────────────────────────────────────

# tmux requires TERM to be screen/tmux-derived internally.
set -g default-terminal "tmux-256color"

# Termius sends xterm-256color as the outer TERM — declare truecolor for it.
# Add additional patterns if you switch outer terminals.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# Fallback for tmux <3.2 and terminals that don't set RGB via terminal-features.
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm-kitty:Tc"

# ─── Ergonomics ──────────────────────────────────────────────────────────────

# Faster escape handling (useful for vi-mode; remove if Alt/meta keys break).
set -s escape-time 10

# Extended keys: allow tmux to recognize Alt/Meta from terminals that support it.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Long scrollback for Claude output and command transcripts.
set -g history-limit 100000

# Mouse support for scroll and copy in long AI outputs.
set -g mouse on

# Pass focus events to applications (helps some TUIs).
set -g focus-events on

# Resize window to the most recently active client, not the smallest attached one.
set -g window-size latest

# Disable right-click context menu.
unbind -n MouseDown3Pane
unbind -n MouseDown3Status
unbind -n MouseDown3StatusLeft

# ─── Mouse select → system clipboard ────────────────────────────────────────

# tmux-yank handles MouseDragEnd1Pane via TPM (loaded at bottom of this file).
# @yank_action 'copy-pipe' keeps copy-mode active after drag-select, so the
# viewport stays at the scroll position instead of jumping to the bottom.
# @yank_selection_mouse targets the system clipboard (not X11 primary).
set -g @yank_action 'copy-pipe-and-cancel'
set -g @yank_selection_mouse 'clipboard'

# Ensure clicking in copy-mode only selects the pane (no cancel). Without this,
# a stale binding from a prior source-file could persist and cancel copy-mode on
# click, causing the viewport to jump to the bottom.
bind -T copy-mode    MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane

# ─── Mouse scroll in TUI apps ───────────────────────────────────────────────

# When alternate screen is active (Claude Code, vim, etc.), send 5 lines per
# scroll tick instead of 1, so scrolling feels like page movement.
bind -n WheelUpPane   if-shell -F "#{alternate_on}" "send-keys Up Up Up Up Up" "select-pane -t=; copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys Down Down Down Down Down" "select-pane -t=; send-keys -M"

# ─── Window naming ───────────────────────────────────────────────────────────

# Auto-rename windows based on the foreground command.
# Claude Code's binary is a symlink to a version-named file (e.g. 2.1.86),
# so tmux sees the version as pane_current_command. Match semver → "claude".
# Similarly, codex-* → "codex".
set -wg automatic-rename on
set -wg automatic-rename-format "#{s/^[0-9]+\\.[0-9]+\\.[0-9]+$/claude/:#{s/^codex-.*/codex/:pane_current_command}}"
set -wg allow-rename off

# ─── Status bar ──────────────────────────────────────────────────────────────

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name (path on wide, session name only on narrow to save space)
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa]#[fg=#1e1e2e]#[bold] #{b:pane_current_path} #[default] "

# Right: keybind cheatsheet — dynamically adapts based on available space.
# avail = client_width - 15 (left) - session_windows * 10 (tabs)
# ≥65: full  |  ≥45: nav+tools  |  ≥25: nav  |  <25: empty
# #{e|>=:} for numeric comparison (#{>=:} is lexicographic in tmux 3.4+).
set -g status-right-length 110
set -g status-right "#{?#{==:#{pane_mode},tree-mode},#[fg=#a6adc8] Enter attach  x kill  / search  t tag  q quit,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},65},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢ #[bold]0#[nobold]-9  #[fg=#45475a]│#[fg=#a6adc8] #[bold]c#[nobold]new #[bold]m#[nobold]erge #[bold]z#[nobold]oom  #[fg=#45475a]│#[fg=#a6adc8] ^#[bold]󱁐#[nobold] thumbs  ^#[bold]?#[nobold]fuzzback  #[fg=#45475a]│#[fg=#a6adc8] ^#[bold]s#[nobold]ave ^#[bold]r#[nobold]estore,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},45},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢ #[bold]0#[nobold]-9  #[fg=#45475a]│#[fg=#a6adc8] #[bold]c#[nobold]new #[bold]m#[nobold]erge #[bold]z#[nobold]oom,#{?#{e|>=:#{e|-:#{client_width},#{e|+:15,#{e|*:#{session_windows},10}}},25},#[fg=#a6adc8] #[bold]h#[nobold]← #[bold]l#[nobold]→ #[bold]k#[nobold]↑ #[bold]j#[nobold]↓  #[bold]n#[nobold]⊣ #[bold]p#[nobold]⊢,}}}}"

# Window tabs
set -g window-status-format         "#[fg=#6c7086] #I:#W#{?#{>:#{window_panes},1},(#{e|+:#{pane_index},1}/#{window_panes}),} "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I:#W#{?#{>:#{window_panes},1},(#{e|+:#{pane_index},1}/#{window_panes}),} #[default]"
set -g window-status-separator      ""

# ─── Clipboard ───────────────────────────────────────────────────────────────

# OSC 52: lets tmux set the host clipboard over SSH without X11 forwarding.
# "external" prevents apps inside tmux from setting the clipboard (security).
set -s set-clipboard external
set -as terminal-features ",xterm-256color:clipboard"

# ─── Environment refresh on attach ───────────────────────────────────────────

# Copy these vars into the session when you reattach from another machine.
# SSH_AUTH_SOCK is excluded — update-environment removes it when a client
# attaches without it set, breaking SSH in existing sessions.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_CONNECTION SSH_TTY XAUTHORITY LANG LC_ALL LC_CTYPE TERM_PROGRAM COLORTERM"

# ─── Keybindings ─────────────────────────────────────────────────────────────

# Reload config without restarting.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded"

# Splits that inherit the current pane's path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Popup scratch shell: overlay zsh, closes on exit, inherits current path.
bind p display-popup -E -d "#{pane_current_path}" -w 90% -h 60% "zsh"

# ─── Option+key bindings (no prefix needed) ──────────────────────────────────

# Pane navigation
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Pane splits
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Window switching
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# New window in current directory
bind -n M-c new-window -c "#{pane_current_path}"

# Zoom pane toggle
bind -n M-z resize-pane -Z

# Session manager (built-in)
bind -n M-s choose-tree -Zs -F '#{session_name}: #{b:pane_current_path}  (#{session_windows}w)  #{pane_current_command}  #{t:session_activity}'

# Toggle between even-horizontal (side-by-side) and even-vertical (stacked)
# Uses a per-window toggle variable to reliably alternate.
bind -n M-Space if-shell 'test "#{@layout_toggle}" = "h"' \
  'select-layout even-vertical ; set -w @layout_toggle v' \
  'select-layout even-horizontal ; set -w @layout_toggle h'

# Merge next window into current as a vertical split
bind -n M-m join-pane -s :+1

# Kill focused pane only
bind -n M-x kill-pane

# Kill entire session
bind -n M-X kill-session

# Detach
bind -n M-d detach-client

# ─── Codex window ────────────────────────────────────────────────────────────

# Open codex in a new named window; auto-rename is disabled so it stays "codex".
bind -n M-q new-window -n "codex" \; set-window-option automatic-rename off \; send-keys "codex" Enter

# ─── Logging ─────────────────────────────────────────────────────────────────

# Toggle pane output logging to file. Run mkdir -p ~/.tmux/logs first.
bind L pipe-pane -o "cat >> ~/.tmux/logs/output.#I-#P.log"

# Kill current session instantly (no confirmation).
bind X kill-session

# ─── Stale session cleanup ───────────────────────────────────────────────────

# Kill unattached sessions idle for >3 hours.
# Runs on detach and session close; also via cron for periodic sweep.
# Script: tmux-cleanup.sh (deploy to ~/.tmux/cleanup.sh on each machine).
set-hook -g client-detached[0] 'run-shell -b "$HOME/.tmux/cleanup.sh"'
set-hook -g session-closed[0]  'run-shell -b "$HOME/.tmux/cleanup.sh"'

# ─── Plugins ─────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'tmux-plugins/tmux-yank'
run 'PATH=/opt/homebrew/bin:/usr/local/bin:$PATH ~/.tmux/plugins/tpm/tpm'
